<section class="py-20 bg-background text-text">
  <div class="container mx-auto px-4 text-center">
    <h2 class="text-3xl font-bold mb-8">Contact Me</h2>
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="max-w-lg mx-auto">
      <div class="honeypot" aria-hidden="true">
        <label for="contact-website">Leave this field blank</label>
        <input id="contact-website" type="text" formControlName="_gotcha" tabindex="-1" autocomplete="off">
      </div>
      <div class="mb-4">
        <label for="contact-name" class="sr-only">Your name</label>
        <input id="contact-name" type="text" formControlName="name" autocomplete="name" maxlength="100" placeholder="Your Name" class="w-full p-3 rounded bg-secondary border border-gray-600 focus:outline-none focus:border-primary">
      </div>
      <div class="mb-4">
        <label for="contact-email" class="sr-only">Your email</label>
        <input id="contact-email" type="email" formControlName="email" autocomplete="email" maxlength="254" placeholder="Your Email" class="w-full p-3 rounded bg-secondary border border-gray-600 focus:outline-none focus:border-primary">
      </div>
      <div class="mb-4">
        <label for="contact-message" class="sr-only">Your message</label>
        <textarea id="contact-message" formControlName="message" maxlength="5000" placeholder="Your Message" rows="5" class="w-full p-3 rounded bg-secondary border border-gray-600 focus:outline-none focus:border-primary"></textarea>
      </div>
      <button type="submit" [disabled]="contactForm.invalid || formStatus === 'submitting'" class="bg-primary text-white py-3 px-6 rounded-full disabled:bg-gray-500">
        @if (formStatus === 'idle') { <span>Send Message</span> }
        @if (formStatus === 'submitting') { <span>Sending...</span> }
        @if (formStatus === 'success') { <span>Message Sent!</span> }
        @if (formStatus === 'error') { <span>Error Sending</span> }
      </button>
      @if (formStatus === 'success') {
        <div class="mt-4 text-green-400" role="status" aria-live="polite">Thank you for your message!</div>
      }
      @if (formStatus === 'error') {
        <div class="mt-4 text-red-400" role="alert">There was an error sending your message. Please try again later.</div>
      }
    </form>
  </div>
</section>
