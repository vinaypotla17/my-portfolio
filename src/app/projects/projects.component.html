<section id="projects" class="py-20 bg-secondary text-text">
  <div class="container mx-auto">
    <h2 class="text-3xl font-bold text-center mb-12">Notable Projects</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (project of projects(); track project.name) {
        <div class="bg-background rounded-lg p-6 shadow-lg transform hover:scale-105 transition-transform duration-300">
          <h3 class="text-2xl font-bold mb-2">{{ project.name }}</h3>
          <p>{{ project.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
