<section class="py-20 bg-secondary text-text">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl font-bold text-center mb-12">Notable Projects</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      @for (project of projects(); track project.name) {
        <article class="bg-background rounded-lg p-6 shadow-lg">
          <h3 class="text-2xl font-bold mb-2">{{ project.name }}</h3>
          <p>{{ project.description }}</p>
          <ul class="flex flex-wrap gap-2 mt-4" [attr.aria-label]="project.name + ' technologies'">
            @for (technology of project.technologies; track technology) {
              <li class="text-sm px-3 py-1 rounded-full border border-primary text-text">{{ technology }}</li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
