<section class="py-20 bg-background text-text text-center">
  <div class="container mx-auto px-4">
    <h1 class="text-5xl font-bold mb-2">{{ heroData().name }}</h1>
    <p class="text-2xl font-semibold mb-4">{{ heroData().title }}</p>
    <p class="contact-links text-xl mb-8">
      <a [href]="'mailto:' + heroData().email">{{ heroData().email }}</a>
      <span aria-hidden="true">|</span>
      <a [href]="'tel:' + heroData().phone">{{ heroData().phone }}</a>
      <span aria-hidden="true">|</span>
      <a [href]="heroData().linkedin" target="_blank" rel="noopener noreferrer" class="text-primary hover:underline">LinkedIn</a>
    </p>
    <div class="hero-actions">
      <a class="hero-action hero-action--primary" href="#projects">View Projects</a>
      <a class="hero-action" href="Vinay-Potla-Resume.pdf" download>Download Résumé</a>
      <a class="hero-action" href="#contact">Contact Me</a>
    </div>
  </div>
</section>
