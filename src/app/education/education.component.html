<section class="py-20 bg-secondary text-text">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl font-bold text-center mb-12">Education</h2>
    <div class="flex flex-col md:flex-row justify-center items-stretch gap-8">
      @for (edu of education(); track edu.university) {
        <article class="education-card p-6 bg-background rounded-lg text-center shadow-lg">
          <div class="logo-plate">
            <img [src]="edu.logo" [alt]="edu.university + ' logo'">
          </div>
          <h3 class="text-2xl font-bold mb-2">{{ edu.university }}</h3>
          <p class="text-lg mb-1">{{ edu.degree }}</p>
          <p class="text-md text-gray-400">{{ edu.year }}</p>
        </article>
      }
    </div>
  </div>
</section>
