<section class="py-20 bg-background text-text">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl font-bold text-center mb-8">Technical Skills</h2>
    <div class="mb-8 text-center">
      <label for="skill-search" class="sr-only">Search skills</label>
      <input id="skill-search" type="search" placeholder="Search Skills..." (input)="onSearch($event)" class="w-full max-w-md p-3 rounded bg-secondary border border-gray-600 focus:outline-none focus:border-primary">
    </div>

    @for (category of skillCategories(); track category.key) {
      <div class="mb-12">
        <h3 class="text-2xl font-bold text-center mb-8">{{ category.label }}</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-8 text-center">
          @for (skill of category.skills; track skill.name) {
            <div class="p-4 bg-secondary rounded-lg">
              <div class="logo-plate">
                <img [src]="skill.logo" [alt]="skill.name">
              </div>
              <p>{{ skill.name }}</p>
            </div>
          }
        </div>
      </div>
    }
  </div>
</section>
